<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Stock Guru launcher icon: dark green square, three candles and a rising reading line. Original HomiLabs vector. -->
  <rect width="512" height="512" fill="#1B5E20"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7D32" stop-opacity="1"/>
      <stop offset="1" stop-color="#1B5E20" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- candles -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <line x1="150" y1="200" x2="150" y2="372"/>
    <line x1="256" y1="150" x2="256" y2="330"/>
    <line x1="362" y1="110" x2="362" y2="280"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="124" y="250" width="52" height="92" rx="8"/>
    <rect x="230" y="190" width="52" height="100" rx="8"/>
    <rect x="336" y="140" width="52" height="96" rx="8"/>
  </g>
  <!-- reading line -->
  <polyline points="96,392 192,330 288,300 416,160" fill="none" stroke="#A5D6A7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="416" cy="160" r="22" fill="#A5D6A7"/>
</svg>
